<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />

    <!-- SEO (parity with former sudo.kapadiya.net / smov) -->
    <title>sudo-flix</title>
    <meta
      name="description"
      content="Watch your favorite shows and movies for free with no ads ever! (っ'ヮ'c)"

    <meta name="theme-color" content="#120f1d" />

    <meta name="referrer" content="no-referrer" />

      name="twitter:description"
      content="Watch your favorite shows and movies for free with no ads ever! (っ'ヮ'c)"
    />

    <link rel="preconnect" href="https://api.themoviedb.org" />

    <script type="module">
      if (import.meta.env.DEV) {
        import("react-grab");
      }

    <div id="root"></div>
